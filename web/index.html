<!doctype html>
<html lang="grc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iliad Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Ὁμήρου Ἰλιάς</p>
    <h1 id="book-title"></h1>
    <p class="credit" id="translation-credit">English: A. T. Murray (Loeb, 1924), via Perseus</p>
  </header>
  <ol id="verses" aria-live="off"></ol>
</main>

<footer id="player">
  <audio id="audio" controls preload="metadata"></audio>
  <div class="controls">
    <button id="prev" title="Previous verse (←)" aria-label="Previous verse">‹</button>
    <span id="position">—</span>
    <button id="next" title="Next verse (→)" aria-label="Next verse">›</button>
    <label class="toggle push" title="Pause at the end of the verse the pointer is on; resume when it moves off"><input type="checkbox" id="hold-on-hover"> pause on hover</label>
    <label class="toggle"><input type="checkbox" id="show-paraphrase" checked> paraphrase</label>
    <label class="toggle"><input type="checkbox" id="show-translation"> translation</label>
    <label class="toggle"><input type="checkbox" id="follow" checked> follow</label>
  </div>
</footer>

<div id="gloss" role="tooltip" hidden></div>

<aside id="card" hidden aria-live="polite">
  <button id="card-close" aria-label="Close">×</button>
  <div id="card-body"></div>
</aside>
<script src="app.js"></script>
</body>
</html>
